<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PsychoMagic — скачать лаунчер</title>
<meta name="description" content="PsychoMagic — лаунчер для Minecraft сервера с модами. Скачать последнюю версию.">
<style>
  :root {
    --bg: #0a0614;
    --text: #f1eaff;
    --muted: #a597c9;
    --accent: #a855f7;
    --accent2: #ec4899;
    --cyan: #22d3ee;
    --border: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ---------- ГЕРОЙ ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px 220px;
    background:
      radial-gradient(ellipse at 50% 0%, #3b1a73 0%, transparent 60%),
      linear-gradient(180deg, #0a0614 0%, #1a0b3a 70%, #2b1060 100%);
    overflow: hidden;
  }
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  .moon {
    position: absolute;
    top: 9%; right: 12%;
    width: 110px; height: 110px;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 40px rgba(236,200,255,.55));
    animation: bob 8s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(14px); } }

  .cube {
    position: absolute;
    width: 34px; height: 34px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 28px rgba(168,85,247,.7), inset 0 0 0 3px rgba(255,255,255,.18);
    opacity: .85;
    animation: spin 12s linear infinite, bob 6s ease-in-out infinite;
  }
  .cube.c1 { left: 9%;  top: 22%; }
  .cube.c2 { left: 20%; top: 58%; width: 22px; height: 22px; animation-duration: 9s, 7s; background: linear-gradient(135deg, var(--cyan), var(--accent)); box-shadow: 0 0 24px rgba(34,211,238,.7), inset 0 0 0 3px rgba(255,255,255,.18); }
  .cube.c3 { right: 10%; top: 48%; width: 28px; height: 28px; animation-duration: 15s, 9s; }
  .cube.c4 { right: 24%; top: 20%; width: 18px; height: 18px; animation-duration: 8s, 5s; background: linear-gradient(135deg, var(--cyan), var(--accent)); box-shadow: 0 0 24px rgba(34,211,238,.7), inset 0 0 0 3px rgba(255,255,255,.18); }
  @keyframes spin { to { rotate: 360deg; } }

  .content { position: relative; z-index: 2; max-width: 640px; }
  .logo {
    width: 120px; height: 120px;
    margin: 0 auto 24px;
    filter: drop-shadow(0 0 30px rgba(168,85,247,.8));
    animation: bob 5s ease-in-out infinite;
  }
  h1 {
    font-size: clamp(2.6rem, 9vw, 4.4rem);
    font-weight: 900;
    letter-spacing: -.03em;
    line-height: 1.05;
    background: linear-gradient(90deg, #fff, #d8b4fe 45%, #f9a8d4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 14px;
  }
  .tagline { color: var(--muted); font-size: 1.15rem; margin-bottom: 38px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-weight: 800;
    font-size: 1.2rem;
    padding: 17px 44px;
    border-radius: 14px;
    text-decoration: none;
    box-shadow: 0 10px 40px rgba(168,85,247,.5);
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 56px rgba(236,72,153,.55); }
  .btn svg { width: 24px; height: 24px; }
  .version { margin-top: 16px; color: var(--muted); font-size: .92rem; }

  /* пиксельный ландшафт внизу героя */
  #terrain {
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 230px;
    z-index: 1;
    image-rendering: pixelated;
  }

  /* ---------- СКРИНШОТЫ ---------- */
  .shots {
    background: #2b1060;
    padding: 20px 20px 70px;
    text-align: center;
  }
  .shots h2 { font-size: 1.6rem; margin-bottom: 26px; }
  .gallery {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
  }
  .gallery img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    transition: transform .25s;
  }
  .gallery img:hover { transform: translateY(-5px) scale(1.02); }

  footer {
    text-align: center;
    padding: 26px;
    background: #1a0b3a;
    color: var(--muted);
    font-size: .9rem;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: #fff; }
</style>
</head>
<body>

<section class="hero">
  <canvas id="stars"></canvas>

  <!-- пиксельная луна -->
  <svg class="moon" viewBox="0 0 11 11" shape-rendering="crispEdges">
    <g fill="#f3e8ff">
      <rect x="3" y="0" width="5" height="1"/><rect x="1" y="1" width="9" height="1"/>
      <rect x="0" y="2" width="11" height="7"/><rect x="1" y="9" width="9" height="1"/>
      <rect x="3" y="10" width="5" height="1"/>
    </g>
    <g fill="#d8b4fe">
      <rect x="2" y="3" width="2" height="2"/><rect x="6" y="2" width="1" height="1"/>
      <rect x="7" y="5" width="2" height="2"/><rect x="3" y="7" width="2" height="1"/>
    </g>
  </svg>

  <div class="cube c1"></div>
  <div class="cube c2"></div>
  <div class="cube c3"></div>
  <div class="cube c4"></div>

  <div class="content">
    <!-- логотип: магический кристалл -->
    <svg class="logo" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#ec4899"/>
        </linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#be185d"/>
        </linearGradient>
      </defs>
      <polygon points="50,4 82,34 50,96 18,34" fill="url(#g2)"/>
      <polygon points="50,4 82,34 50,40" fill="#f0abfc"/>
      <polygon points="50,4 18,34 50,40" fill="url(#g1)"/>
      <polygon points="18,34 50,40 50,96" fill="#9333ea"/>
      <polygon points="82,34 50,40 50,96" fill="#6d28d9"/>
      <polygon points="50,4 58,20 50,26 42,20" fill="#fff" opacity=".45"/>
    </svg>

    <h1>PsychoMagic</h1>
    <p class="tagline">Лаунчер для сервера Minecraft с модами</p>

    <a id="download" class="btn" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>
      <span id="btn-text">Скачать</span>
    </a>
    <p id="version" class="version">Загрузка информации о версии…</p>
  </div>

  <svg id="terrain" preserveAspectRatio="xMidYMax slice"></svg>
</section>

<!-- Скриншоты: положи картинки в папку screenshots/ (1.png, 2.png, 3.png). Если их нет — блок скрыт. -->
<section class="shots" id="shots" hidden>
  <h2>Скриншоты</h2>
  <div class="gallery" id="gallery"></div>
</section>

<footer>
  <a id="repo-link" href="#">GitHub</a>
</footer>

<script>
  // ======= НАСТРОЙКИ =======
  const REPO = "fufliik/Glava_Launcher";   // владелец/репозиторий с релизами
  const SCREENSHOTS = ["screenshots/1.png", "screenshots/2.png", "screenshots/3.png"];
  // =========================

  /* ---------- звёзды ---------- */
  (function stars() {
    const c = document.getElementById("stars");
    const ctx = c.getContext("2d");
    let list = [];
    function resize() {
      c.width = c.offsetWidth; c.height = c.offsetHeight;
      list = Array.from({ length: Math.floor(c.width * c.height / 5500) }, () => ({
        x: Math.random() * c.width, y: Math.random() * c.height * .85,
        s: Math.random() < .2 ? 3 : 2, p: Math.random() * 6.28, v: .5 + Math.random() * 1.5
      }));
    }
    function draw(t) {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const s of list) {
        ctx.globalAlpha = .3 + .7 * Math.abs(Math.sin(t / 1000 * s.v + s.p));
        ctx.fillStyle = "#fff";
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }
      requestAnimationFrame(draw);
    }
    resize(); addEventListener("resize", resize); requestAnimationFrame(draw);
  })();

  /* ---------- пиксельный ландшафт ---------- */
  (function terrain() {
    const svg = document.getElementById("terrain");
    const B = 20, COLS = 80, ROWS = 12;
    svg.setAttribute("viewBox", `0 0 ${COLS * B} ${ROWS * B}`);
    const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
    let out = "";
    for (let i = 0; i < COLS; i++) {
      const h = Math.round(6 + 2.2 * Math.sin(i * .28) + 1.6 * Math.sin(i * .83 + 1.3) + .8 * Math.sin(i * 1.9));
      for (let r = 0; r < h; r++) {
        const y = (ROWS - 1 - r) * B;
        const depth = h - 1 - r; // 0 = верхний слой
        let col;
        if (depth === 0)      col = hash(i) < .5 ? "#a855f7" : "#9333ea";
        else if (depth < 3)   col = hash(i * 7 + r) < .5 ? "#5b21b6" : "#4c1d95";
        else                  col = hash(i * 3 + r) < .5 ? "#2e1065" : "#3b0764";
        out += `<rect x="${i * B}" y="${y}" width="${B}" height="${B}" fill="${col}"/>`;
        if (depth === 0) out += `<rect x="${i * B}" y="${y}" width="${B}" height="4" fill="#d8b4fe" opacity=".55"/>`;
      }
      // светящиеся кристаллы
      if (hash(i * 13.7) > .86) {
        const top = (ROWS - h) * B, x = i * B + B / 2;
        out += `<polygon points="${x},${top - 38} ${x + 9},${top - 14} ${x},${top} ${x - 9},${top - 14}" fill="${hash(i) > .5 ? "#22d3ee" : "#f472b6"}" style="filter:drop-shadow(0 0 8px currentColor)"/>`;
      }
    }
    svg.innerHTML = out;
  })();

  /* ---------- скриншоты ---------- */
  (function shots() {
    const gallery = document.getElementById("gallery");
    const section = document.getElementById("shots");
    SCREENSHOTS.forEach(src => {
      const img = new Image();
      img.alt = "Скриншот PsychoMagic";
      img.onload = () => { gallery.appendChild(img); section.hidden = false; };
      img.src = src;
    });
  })();

  /* ---------- скачивание ---------- */
  const btn = document.getElementById("download");
  const btnText = document.getElementById("btn-text");
  const versionEl = document.getElementById("version");
  btn.href = `https://github.com/${REPO}/releases/latest`;
  document.getElementById("repo-link").href = `https://github.com/${REPO}`;

  function detectOS() {
    const ua = navigator.userAgent.toLowerCase();
    if (ua.includes("win")) return "windows";
    if (ua.includes("mac")) return "mac";
    if (ua.includes("linux")) return "linux";
    return null;
  }
  function matchesOS(name, os) {
    name = name.toLowerCase();
    if (os === "windows") return /\.(exe|msi)$|win/.test(name);
    if (os === "mac") return /\.(dmg|pkg)$|mac|darwin|osx/.test(name);
    if (os === "linux") return /\.(appimage|deb|rpm)$|linux/.test(name);
    return false;
  }

  fetch(`https://api.github.com/repos/${REPO}/releases/latest`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(release => {
      const date = new Date(release.published_at).toLocaleDateString("ru-RU");
      versionEl.textContent = `Версия ${release.tag_name} · ${date}`;
      const assets = (release.assets || []).filter(a => !/\.(sha256|sig|txt)$/i.test(a.name));
      if (!assets.length) return;
      const file = assets.find(a => matchesOS(a.name, detectOS())) || assets[0];
      btn.href = file.browser_download_url;   // прямая ссылка — скачивание начнётся сразу
      btn.setAttribute("download", file.name);
    })
    .catch(() => { versionEl.textContent = "Последняя версия на GitHub"; });
</script>
</body>
</html>
