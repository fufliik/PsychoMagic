[package]
name = "minecraft"
version = "0.0.3"
edition = "2024"

[dependencies]
slint = "1.18.1"
tokio = { version = "1.53.1", features = ["full"] }
lyceris = "1.1.3"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
self_update = { version = "1.3.0", features = ["archive-zip", "compression-zip-deflate"] }
mc-server-status = "1.0.0"



reqwest = { version = "0.13.5", features = ["blocking"] }
zip-extract = "0.4.1"


[build-dependencies]
slint-build = "1.18.1"


[profile.release]
opt-level = 3          # максимальная скорость ("s" или "z", если важнее размер)
lto = "fat"            # оптимизация на уровне всей программы
codegen-units = 1      # лучше оптимизация, но дольше сборка
panic = "abort"        # меньше размер бинарника, без раскрутки стека
strip = true           # убрать символы и отладочную информацию
debug = false
overflow-checks = false
incremental = false